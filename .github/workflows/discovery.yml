name: Discovery Engine software qualification
on:
  pull_request:
    paths:
      - 'learning/discovery/**'
      - 'learning/native_meditation/**'
      - 'tools/discovery*'
      - 'tests/test_discovery*'
      - 'tests/test_research_notebook.py'
      - '.github/workflows/discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Record tested commit and tree
        run: |
          mkdir evidence
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git log -1 --format='%H %T' > evidence/revision.txt
          python -VV > evidence/python.txt
          python -m pip freeze > evidence/dependencies.txt
      - name: Run discovery and scheduler regressions
        run: python -m pytest -q tests/test_discovery*.py tests/test_research_notebook.py tests/test_native_meditation*.py tests/test_meditation_consultation.py --junitxml=evidence/focused.xml
      - name: Run offline fixture benchmark twice per question
        run: python -m tools.discovery_evaluation --output evidence/offline-synthetic.json
      - name: Run collaborative research across clean processes
        run: python -m tools.discovery_collaborative_demo "$RUNNER_TEMP/collaborative" > evidence/collaborative.json
      - name: Run ownership contracts
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python tools/check_unified_contracts.py | tee evidence/contracts.txt
      - name: Run full software regression suite
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests --junitxml=evidence/full.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-software-${{ env.CANDIDATE_SHA }}
          path: evidence/
