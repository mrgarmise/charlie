name: ELEGOO S3 camera integration independent validation
on:
  push:
    branches: ['feature/elegoo-s3-camera-**']
  pull_request:
    paths: ['firmware/elegoo-s3-camera/**', '.github/workflows/elegoo-s3-integration.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: c8a7a8d471130e40d9a5ecf827870118f3757b8f
          path: reviewed-peer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest==8.4.2 playwright==1.56.0 zeroconf==0.148.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - run: python firmware/elegoo-s3-camera/tools/host_tests.py --sanitizers address,undefined
      - run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined firmware/elegoo-network/tests/core.cpp -o /tmp/prior-core-tests
      - run: /tmp/prior-core-tests
      - run: python -m pytest firmware/elegoo-s3-camera/tests -q --junitxml=s3-integration-host.xml
        env:
          CHARLIE_PEER_ROOT: ${{ github.workspace }}/reviewed-peer
      - run: python -m pytest tests/test_elegoo_command_auth.py tests/test_elegoo_timed_pulse.py tests/test_elegoo_stop_ack_deadline.py tests/test_unified_actuator_requests.py tests/test_mobile_console.py -q
      - run: python tools/check_unified_contracts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-host-validation
          path: s3-integration-host.xml
  native-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.2
      - run: python -m pip install pyserial==3.5
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: python firmware/elegoo-s3-camera/tools/build.py --arduino-data /home/runner/.arduino15 --build-dir /tmp/s3-opi --psram opi --clean
      - run: python firmware/elegoo-s3-camera/tools/build.py --arduino-data /home/runner/.arduino15 --build-dir /tmp/s3-qspi --psram qspi --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BUILD-ONLY-NOT-HARDWARE-QUALIFIED-reports
          path: |
            /tmp/s3-opi/build-report.json
            /tmp/s3-opi/image-info.txt
            /tmp/s3-opi-compile.log
            /tmp/s3-qspi/build-report.json
            /tmp/s3-qspi/image-info.txt
            /tmp/s3-qspi-compile.log
