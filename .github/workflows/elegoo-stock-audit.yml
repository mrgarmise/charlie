name: ELEGOO stock audit offline validation
on:
  pull_request:
    paths: ['tools/audit_elegoo_stock.py', 'tests/test_elegoo_stock_audit.py', 'docs/elegoo-network/stock-parity**', '.github/workflows/elegoo-stock-audit.yml']
permissions:
  contents: read
jobs:
  offline-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_elegoo_stock_audit.py -q --junitxml=stock-audit-tests.xml
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-stock-audit
          path: stock-audit-tests.xml
