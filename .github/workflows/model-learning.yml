name: Guarded model learning
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  model-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Obtain exact shared sensory contract without merging active PR
        run: |
          git fetch origin 08ae83f7a6f54a7b0acefc4f240df784f176573e
          git show 08ae83f7a6f54a7b0acefc4f240df784f176573e:stimulus/bus.py > "$RUNNER_TEMP/model-learning-bus.py"
      - name: Obtain exact asynchronous gateway without merging active PR
        run: |
          git fetch origin 4bb3bffecffea0d6e294485132f42f5e96f4c506
          git show 4bb3bffecffea0d6e294485132f42f5e96f4c506:memory/human_interaction.py > "$RUNNER_TEMP/model-learning-gateway.py"
      - name: Independently run worker, Executive, safety and subscription checks
        env:
          CHARLIE_MODEL_LEARNING_SHARED_GATEWAY: ${{ runner.temp }}/model-learning-gateway.py
          CHARLIE_MODEL_LEARNING_SHARED_BUS: ${{ runner.temp }}/model-learning-bus.py
        run: python -m pytest tests/test_model_learning.py tests/test_model_learning_shared_bus.py tests/test_model_learning_shared_gateway.py -q --junitxml=model-learning-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-learning-tests
          path: model-learning-tests.xml
