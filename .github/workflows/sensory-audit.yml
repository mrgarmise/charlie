name: Shared sensory architecture audit
on:
  push:
    branches: [audit/shared-sensory-contracts]
  pull_request:
    paths:
      - 'stimulus/bus.py'
      - 'tests/test_sensory_history.py'
      - '.github/workflows/sensory-audit.yml'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q --junitxml=sensory-audit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensory-audit-software-tests
          path: sensory-audit-tests.xml
