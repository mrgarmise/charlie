name: Unified integration software tests
on:
  push:
    branches: [integration/unified-sensory-motion-20261026]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q --junitxml=unified-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-software-tests
          path: unified-tests.xml
