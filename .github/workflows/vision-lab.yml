name: Vision Lab software fixtures
on:
  push:
    branches: [feature/charlie-vision-lab]
  pull_request:
    paths: ['vision_lab/**', 'tests/vision_lab/**', 'requirements-vision-lab*.txt', '.github/workflows/vision-lab.yml']
  workflow_dispatch:
    inputs:
      real_cpu_training:
        description: Run actual CPU training/export/cancellation on synthetic fixtures
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-vision-lab.txt pytest
      - name: Optional actual CPU training dependencies
        if: inputs.real_cpu_training == true
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-vision-lab-training.txt
      - name: Verify engineering fixtures without hardware activation
        env:
          VISION_LAB_ML_TESTS: ${{ inputs.real_cpu_training && '1' || '0' }}
        run: python -m pytest tests/vision_lab -q --junitxml=vision-lab-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-lab-tests
          path: vision-lab-tests.xml
